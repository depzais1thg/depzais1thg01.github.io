<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>A Little Gift For You</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="background">
      <span class="decoration">💜</span>
      <span class="decoration">⭐</span>
      <span class="decoration">🧀</span>
      <span class="decoration">💗</span>
      <span class="decoration">🌳</span>
      <span class="decoration">✨</span>
      <span class="decoration">🧀</span>
      <span class="decoration">💖</span>
    </div>

    <main>
      <!-- TRANG ĐẦU -->

      <section class="gift-page" id="giftPage">
        <h1>A Little Gift For You</h1>

        <div class="gift-container">
          <div class="gift-box" id="giftBox">
            <div class="gift-lid"></div>

            <div class="gift-body"></div>

            <div class="gift-ribbon"></div>
          </div>
        </div>

        <button id="openButton">🎁 MỞ HỘP QUÀ 🎁</button>

        <p class="hint">Có một món quà nhỏ dành cho bạn...</p>
      </section>

      <!-- TRANG SAU -->

      <section class="surprise-page" id="surprisePage">
        <div class="heart-tree">
          <div class="tree-top">
            <span>💗</span>
            <span>💖</span>
            <span>💕</span>
            <span>💗</span>
            <span>💓</span>
            <span>💖</span>
            <span>💗</span>
            <span>💕</span>
            <span>💓</span>
            <span>💗</span>
            <span>💖</span>
            <span>💕</span>
          </div>

          <div class="tree-trunk"></div>
        </div>

        <h1 class="wish">Chúc bạn luôn vui vẻ!</h1>

        <p class="message">
          Mong rằng mỗi ngày của bạn đều có thật nhiều niềm vui 💜
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
